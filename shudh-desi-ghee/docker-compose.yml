services:
  db:
    image: postgres:16-alpine
    container_name: shudh-desi-ghee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shudh_desi_ghee
    volumes:
      - shudh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shudh_desi_ghee"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shudh-desi-ghee-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shudh_desi_ghee?sslmode=disable
      JWT_ACCESS_SECRET: shudh_desi_ghee_jwt_access_secret_2026
      JWT_REFRESH_SECRET: shudh_desi_ghee_jwt_refresh_secret_2026
      ADMIN_EMAIL: admin@shudhdesighee.com
      ADMIN_PASSWORD_HASH: "$$2a$$10$$w8LqMvU7Dk0qgBfIe1a9uO6fW4xWpZ4pX.n.6wLhO8hP2lJ3gR.mG"
      GOOGLE_CLIENT_ID: your-google-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: your-google-client-secret
      RAZORPAY_KEY_ID: rzp_test_your_key_id
      RAZORPAY_KEY_SECRET: your_razorpay_secret
      CLOUDINARY_CLOUD_NAME: your_cloud_name
      CLOUDINARY_API_KEY: your_api_key
      CLOUDINARY_API_SECRET: your_api_secret
      FRONTEND_URL: http://localhost:5174
      PORT: 5001
      NODE_ENV: development
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: your-email@gmail.com
      SMTP_PASSWORD: your-app-password
      SMTP_FROM_EMAIL: "\"Shudh Desi Ghee\" <your-email@gmail.com>"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shudh-desi-ghee-frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: http://localhost:5001/api
      VITE_GOOGLE_CLIENT_ID: your-google-client-id.apps.googleusercontent.com
      VITE_RAZORPAY_KEY_ID: rzp_test_your_key_id
      VITE_BRAND_NAME: Shudh Desi Ghee
    depends_on:
      - backend

volumes:
  shudh_postgres_data:
